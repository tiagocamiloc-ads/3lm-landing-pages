name: Deploy para produtos.3lm.pt

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync
        env:
          SSH_KEY:              ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST:             ${{ secrets.DEPLOY_HOST }}
          SSH_USER:             ${{ secrets.DEPLOY_USER }}
          SSH_PORT:             ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH:          ${{ secrets.DEPLOY_PATH }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRM_PASSWORD:         ${{ secrets.CRM_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Generate config.php from secrets (never committed to repo)
          printf '<?php\ndefine("RESEND_API_KEY", "%s");\ndefine("SUPABASE_URL", "%s");\ndefine("SUPABASE_SERVICE_KEY", "%s");\ndefine("CRM_PASSWORD", "%s");\n' \
            "$RESEND_API_KEY" "$SUPABASE_URL" "$SUPABASE_SERVICE_KEY" "$CRM_PASSWORD" > config.php

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            tendas.html tendas_obrigado.html send-lead.php crm-api.php crm.html config.php \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Verificar deploy
        env:
          SSH_KEY:     ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST:    ${{ secrets.DEPLOY_HOST }}
          SSH_USER:    ${{ secrets.DEPLOY_USER }}
          SSH_PORT:    ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "ls -lh $DEPLOY_PATH/tendas.html $DEPLOY_PATH/send-lead.php $DEPLOY_PATH/crm.html $DEPLOY_PATH/crm-api.php"
