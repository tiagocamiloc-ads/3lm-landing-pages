name: Deploy para produtos.3lm.pt

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync
        env:
          SSH_KEY:            ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST:           ${{ secrets.DEPLOY_HOST }}
          SSH_USER:           ${{ secrets.DEPLOY_USER }}
          SSH_PORT:           ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH:        ${{ secrets.DEPLOY_PATH }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Generate config.php from secrets (never committed to repo)
          cat > config.php <<EOF
          <?php
          define('SUPABASE_URL',         '$SUPABASE_URL');
          define('SUPABASE_SERVICE_KEY', '$SUPABASE_SERVICE_KEY');
          EOF

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            tendas.html tendas_obrigado.html send-lead.php config.php \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Verificar deploy
        env:
          SSH_KEY:     ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST:    ${{ secrets.DEPLOY_HOST }}
          SSH_USER:    ${{ secrets.DEPLOY_USER }}
          SSH_PORT:    ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "ls -lh $DEPLOY_PATH/tendas.html $DEPLOY_PATH/tendas_obrigado.html $DEPLOY_PATH/send-lead.php"
